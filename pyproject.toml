[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_project"
version = "0.1.0"
description = "Proyek RAG untuk Instagram Scrapping"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "langchain-core==1.2.17",
    "langchain-openai==1.1.10",
    "langchain-pinecone==0.2.13",
    "openai==2.24.0",
    "pandas==3.0.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1"]
local-embedding = ["sentence-transformers==5.2.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "backend*"]
